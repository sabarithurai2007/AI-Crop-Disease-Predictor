<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriGuard AI - Crop Health Diagnostics Platform</title>
  <!-- Tailwind CSS v3 CDN for instant styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js for beautiful charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .agri-grid-bg {
      background-color: #f7faf8;
      background-image: 
        radial-gradient(#e2e9e4 1px, transparent 1px), 
        radial-gradient(#e2e9e4 1px, #f7faf8 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(220, 235, 224, 0.6);
    }
    @keyframes scan-line {
      0%, 100% { top: 0%; opacity: 0.3; }
      50% { top: 96%; opacity: 1; }
    }
    .scanner-beam {
      animation: scan-line 2.5s ease-in-out infinite;
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    .floating-card {
      animation: float-slow 6s ease-in-out infinite;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="agri-grid-bg antialiased text-gray-800">
  <div id="root"></div>

  <!-- JSX Application Scripts -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons Components
    const SproutIcon = () => (
      <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    );

    const LeafIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58.9 9.8A7 7 0 0 1 11 20z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
      </svg>
    );

    const HistoryIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const DashboardIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" />
      </svg>
    );

    const UserIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    const LogOutIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    );

    // Root React App Component
    function App() {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('agri_guard_token'));
      const [activeTab, setActiveTab] = useState('home');
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // login / signup
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authMessage, setAuthMessage] = useState('');

      // Form State
      const [usernameInput, setUsernameInput] = useState('');
      const [emailInput, setEmailInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');

      // Auto check session
      useEffect(() => {
        if (token) {
          fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => {
            if (res.ok) return res.json();
            throw new Error("Session expired");
          })
          .then(data => setUser(data))
          .catch(() => handleLogout());
        }
      }, [token]);

      const handleLogout = () => {
        localStorage.removeItem('agri_guard_token');
        setToken(null);
        setUser(null);
        setActiveTab('home');
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthMessage('');
        setAuthLoading(true);

        const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
        const body = authMode === 'login' 
          ? { email: emailInput, password: passwordInput }
          : { username: usernameInput, email: emailInput, password: passwordInput };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();

          if (res.ok) {
            if (authMode === 'login') {
              localStorage.setItem('agri_guard_token', data.token);
              setToken(data.token);
              setUser(data.user);
              setAuthModalOpen(false);
              // Clean forms
              setEmailInput('');
              setPasswordInput('');
            } else {
              setAuthMessage("Registration successful! You can now log in.");
              setAuthMode('login');
              setPasswordInput('');
            }
          } else {
            setAuthError(data.message || "Operation failed.");
          }
        } catch (err) {
          setAuthError("Could not connect to the API server.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleTabChange = (tab) => {
        if (['predictor', 'history', 'dashboard'].includes(tab) && !user) {
          setAuthMode('login');
          setAuthModalOpen(true);
          return;
        }
        setActiveTab(tab);
      };

      return (
        <div className="min-h-screen flex flex-col agri-grid-bg text-gray-800">
          
          {/* HEADER / NAVIGATION BAR */}
          <nav className="sticky top-0 z-50 glass-panel border-b border-green-100 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16 items-center">
                <div className="flex items-center space-x-2 cursor-pointer" onClick={() => handleTabChange('home')}>
                  <div className="bg-primary-600 text-white p-2 rounded-xl">
                    <SproutIcon />
                  </div>
                  <span className="font-extrabold text-xl tracking-tight text-primary-900">
                    AgriGuard<span className="text-primary-600 font-semibold">AI</span>
                  </span>
                </div>

                <div className="hidden md:flex items-center space-x-1">
                  <button onClick={() => handleTabChange('home')} className={`px-4 py-2 rounded-lg font-medium text-sm transition-all ${activeTab === 'home' ? 'bg-primary-100 text-primary-900' : 'text-gray-600 hover:bg-primary-50/50'}`}>
                    Home
                  </button>
                  {user && (
                    <>
                      <button onClick={() => handleTabChange('predictor')} className={`px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center space-x-1.5 ${activeTab === 'predictor' ? 'bg-primary-100 text-primary-900' : 'text-gray-600 hover:bg-primary-50/50'}`}>
                        <LeafIcon /><span>Diagnosis</span>
                      </button>
                      <button onClick={() => handleTabChange('history')} className={`px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center space-x-1.5 ${activeTab === 'history' ? 'bg-primary-100 text-primary-900' : 'text-gray-600 hover:bg-primary-50/50'}`}>
                        <HistoryIcon /><span>History</span>
                      </button>
                      <button onClick={() => handleTabChange('dashboard')} className={`px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center space-x-1.5 ${activeTab === 'dashboard' ? 'bg-primary-100 text-primary-900' : 'text-gray-600 hover:bg-primary-50/50'}`}>
                        <DashboardIcon /><span>Dashboard</span>
                      </button>
                    </>
                  )}
                </div>

                <div>
                  {user ? (
                    <div className="flex items-center space-x-4">
                      <div className="hidden lg:flex items-center space-x-2 bg-primary-50 border border-primary-100 px-3 py-1.5 rounded-full">
                        <div className="bg-primary-200 p-1 rounded-full text-primary-800"><UserIcon /></div>
                        <span className="text-sm font-semibold text-primary-900">{user.username}</span>
                      </div>
                      <button onClick={handleLogout} className="flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-medium border border-gray-200 text-gray-700 hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all">
                        <LogOutIcon /><span className="hidden sm:inline">Logout</span>
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }} className="bg-primary-600 hover:bg-primary-700 text-white px-5 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm">
                      Sign In
                    </button>
                  )}
                </div>
              </div>
            </div>
          </nav>

          {/* MAIN PAGE VIEWER */}
          <main className="flex-1">
            {activeTab === 'home' && <HomeView onGetStarted={() => handleTabChange('predictor')} user={user} onSignUp={() => { setAuthMode('signup'); setAuthModalOpen(true); }} />}
            {activeTab === 'predictor' && <PredictorView token={token} />}
            {activeTab === 'history' && <HistoryView token={token} onNavigate={handleTabChange} />}
            {activeTab === 'dashboard' && <DashboardView token={token} onNavigate={handleTabChange} />}
          </main>

          {/* FOOTER */}
          <footer className="bg-gray-900 text-gray-400 py-10 border-t border-gray-800">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <div className="flex justify-center items-center space-x-2 text-white mb-4">
                <div className="bg-primary-600 text-white p-1 rounded-lg"><SproutIcon /></div>
                <span className="font-black tracking-wider">AGRIGUARD AI</span>
              </div>
              <p className="text-xs max-w-md mx-auto leading-relaxed">
                Leading-edge deep neural network diagnostics for modern agricultural extensions. Designed to prevent disease spread and improve harvest yield.
              </p>
              <div className="text-[10px] text-gray-600 mt-6">
                © 2026 AgriGuard AI. All rights reserved. Version 1.0.0.
              </div>
            </div>
          </footer>

          {/* AUTHENTICATION MODAL */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-xs">
              <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden relative">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100">
                  ✕
                </button>
                <div className="p-8">
                  <div className="text-center mb-8">
                    <h3 className="text-2xl font-black text-gray-900">{authMode === 'login' ? "Welcome Back" : "Create Account"}</h3>
                    <p className="text-sm text-gray-500 mt-1.5">Access AgriGuard AI analysis logs and statistics</p>
                  </div>

                  {authError && <div className="mb-4 p-3 bg-red-50 text-red-700 text-xs font-semibold rounded-xl">{authError}</div>}
                  {authMessage && <div className="mb-4 p-3 bg-green-50 text-green-800 text-xs font-semibold rounded-xl">{authMessage}</div>}

                  <form onSubmit={handleAuthSubmit} className="space-y-4">
                    {authMode === 'signup' && (
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Username</label>
                        <input type="text" required value={usernameInput} onChange={e => setUsernameInput(e.target.value)} placeholder="Full name" className="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none text-sm focus:border-primary-500" />
                      </div>
                    )}
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Email Address</label>
                      <input type="email" required value={emailInput} onChange={e => setEmailInput(e.target.value)} placeholder="name@example.com" className="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none text-sm focus:border-primary-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Password</label>
                      <input type="password" required value={passwordInput} onChange={e => setPasswordInput(e.target.value)} placeholder="••••••••" className="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none text-sm focus:border-primary-500" />
                    </div>
                    <button type="submit" disabled={authLoading} className="w-full py-3.5 bg-primary-600 text-white font-bold rounded-xl shadow-md hover:bg-primary-700 transition-all mt-6">
                      {authLoading ? "Processing..." : (authMode === 'login' ? "Sign In" : "Register")}
                    </button>
                  </form>

                  <div className="text-center mt-6">
                    <button onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); setAuthMessage(''); }} className="text-xs font-semibold text-primary-600">
                      {authMode === 'login' ? "Don't have an account? Sign up here" : "Already have an account? Log in here"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // HOME SCREEN VIEW
    function HomeView({ onGetStarted, user, onSignUp }) {
      return (
        <div className="max-w-7xl mx-auto px-4 py-20 lg:py-28">
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
            <div className="lg:col-span-7 space-y-6">
              <div className="inline-flex items-center space-x-2 bg-primary-100 text-primary-800 px-4 py-1.5 rounded-full text-xs font-extrabold uppercase">
                🌱 Next-Gen Smart Farming
              </div>
              <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black text-gray-900 leading-tight">
                Protect Your Crops With <span className="text-primary-700">AI Pathology</span>
              </h1>
              <p className="text-gray-500 text-base leading-relaxed max-w-xl">
                AgriGuard AI leverages deep learning to analyze plant foliage, detect anomalies, identify pathogens, and prescribe treatment protocols instantly.
              </p>
              <div className="pt-4 flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                <button onClick={onGetStarted} className="bg-primary-600 hover:bg-primary-700 text-white font-black px-8 py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center space-x-2">
                  <span>Diagnose Leaf Specimen</span>
                </button>
                {!user && (
                  <button onClick={onSignUp} className="bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 font-extrabold px-8 py-4 rounded-2xl transition-colors">
                    Create Free Account
                  </button>
                )}
              </div>
            </div>

            <div className="lg:col-span-5 flex justify-center">
              <div className="bg-white border border-gray-100 p-6 rounded-3xl shadow-xl w-full max-w-sm glass-panel floating-card">
                <div className="flex items-center space-x-4 border-b border-gray-100 pb-4 mb-4">
                  <div className="bg-primary-600 text-white p-2.5 rounded-xl">
                    🛡️
                  </div>
                  <div>
                    <h4 className="font-extrabold text-gray-800 text-sm">Diagnostic System</h4>
                    <p className="text-[11px] text-gray-400 font-medium">Model: Pillow / MobileNet-V2 Fallback</p>
                  </div>
                </div>
                <div className="space-y-3.5">
                  <div className="h-32 rounded-2xl bg-gray-50 border border-gray-200 overflow-hidden flex items-center justify-center">
                    <span className="text-4xl">🍃</span>
                  </div>
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-gray-500">Scan Match Index</span>
                    <span className="font-black text-primary-700">96.8%</span>
                  </div>
                  <div className="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                    <div className="bg-primary-600 h-full w-[96.8%]"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // PREDICTOR / SCAN VIEW
    function PredictorView({ token }) {
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState('');
      const [activeInfoTab, setActiveInfoTab] = useState('symptoms');
      
      const fileInputRef = useRef(null);

      const handleFileChange = (e) => {
        setError('');
        const selectedFile = e.target.files[0];
        if (!selectedFile) return;
        setFile(selectedFile);
        setPreview(URL.createObjectURL(selectedFile));
        setResult(null);
      };

      const handleAnalyze = async () => {
        if (!file) return;
        setAnalyzing(true);
        setError('');

        const formData = new FormData();
        formData.append('image', file);

        try {
          const res = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            setResult(data);
          } else {
            setError(data.message || "Diagnostic failed.");
          }
        } catch (err) {
          setError("Failed to reach Flask backend server.");
        } finally {
          setAnalyzing(false);
        }
      };

      const handleReset = () => {
        setFile(null);
        setPreview(null);
        setResult(null);
        setError('');
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-12">
          <div className="text-center mb-10">
            <h1 className="text-4xl font-extrabold text-gray-900">AI-Powered <span className="text-primary-700">Crop Health Diagnosis</span></h1>
            <p className="text-gray-500 mt-2 text-sm max-w-lg mx-auto">Upload a leaf photograph to run pathology diagnostics.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            {/* Upload preview left panel */}
            <div className="lg:col-span-5 bg-white p-6 rounded-3xl border border-gray-100 shadow-sm glass-panel">
              <h2 className="text-lg font-bold text-gray-800 mb-4 font-black">Upload speciman</h2>
              {error && <div className="mb-4 p-3 bg-red-50 text-red-700 rounded-xl text-xs font-semibold">{error}</div>}
              
              {!preview ? (
                <div onClick={() => fileInputRef.current.click()} className="border-2 border-dashed border-primary-200 hover:border-primary-500 bg-primary-50/10 rounded-2xl p-10 flex flex-col items-center justify-center text-center cursor-pointer min-h-[300px] transition-colors">
                  <input type="file" ref={fileInputRef} onChange={handleFileChange} accept="image/*" className="hidden" />
                  <span className="text-4xl mb-3">📁</span>
                  <p className="font-bold text-gray-800 text-sm">Click to choose leaf photo</p>
                  <p className="text-xs text-gray-400 mt-1">PNG, JPG, JPEG are supported</p>
                </div>
              ) : (
                <div className="space-y-4">
                  <div className="relative rounded-2xl overflow-hidden border border-gray-200 h-[300px] flex items-center justify-center bg-gray-50">
                    <img src={preview} alt="Leaf" className="max-h-full max-w-full object-contain" />
                    {analyzing && <div className="absolute left-0 right-0 h-1 bg-green-500 shadow-[0_0_10px_#22c55e] scanner-beam"></div>}
                  </div>

                  {!result && !analyzing && (
                    <div className="flex space-x-3">
                      <button onClick={handleReset} className="flex-1 py-3 border border-gray-200 text-gray-700 font-bold rounded-xl text-sm">Remove</button>
                      <button onClick={handleAnalyze} className="flex-1 py-3 bg-primary-600 text-white font-bold rounded-xl text-sm">Analyze Leaf</button>
                    </div>
                  )}

                  {analyzing && <div className="py-3 bg-primary-50 text-primary-800 rounded-xl text-sm font-semibold text-center">Neural scanning active...</div>}
                  {result && <button onClick={handleReset} className="w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-xl text-sm">Diagnose Another</button>}
                </div>
              )}
            </div>

            {/* Diagnostic outcomes right panel */}
            <div className="lg:col-span-7">
              {!result ? (
                <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm min-h-[380px] flex flex-col justify-center text-center">
                  <span className="text-5xl mb-4">🔬</span>
                  <h3 className="text-xl font-extrabold text-gray-800">Pathology Scan Desk</h3>
                  <p className="text-sm text-gray-500 mt-2 max-w-xs mx-auto">Please upload a leaf photograph on the left card to initiate automated analysis.</p>
                </div>
              ) : (
                <div className="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden animate-in fade-in duration-300">
                  <div className="p-6 bg-gradient-to-r from-primary-800 to-primary-900 text-white flex justify-between items-center">
                    <div>
                      <span className="text-[10px] font-black uppercase bg-primary-950/40 px-3 py-1 rounded-full">AI Match Detected</span>
                      <h3 className="text-2xl font-black mt-2">{result.crop_name}: <span className="text-primary-200">{result.disease_name}</span></h3>
                    </div>
                    <div className={`px-4 py-2 rounded-2xl text-xs font-black shadow-inner ${result.status === 'Healthy' ? 'bg-green-500/20 text-green-300 border border-green-500/40' : 'bg-red-500/20 text-red-300 border border-red-500/40'}`}>
                      {result.status.toUpperCase()}
                    </div>
                  </div>

                  <div className="px-6 py-4 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
                    <span className="text-xs font-bold text-gray-500">Certainty Score:</span>
                    <div className="flex-1 mx-4 bg-gray-200 rounded-full h-2 overflow-hidden">
                      <div className="h-full bg-primary-600" style={{ width: `${result.confidence}%` }}></div>
                    </div>
                    <span className="text-sm font-black text-gray-800">{result.confidence}%</span>
                  </div>

                  {/* Tabs info */}
                  <div className="flex border-b border-gray-100 bg-white">
                    {['symptoms', 'causes', 'treatment', 'prevention'].map(tab => (
                      <button key={tab} onClick={() => setActiveInfoTab(tab)} className={`flex-1 py-3.5 text-xs font-bold uppercase border-b-2 capitalize transition-colors ${activeInfoTab === tab ? 'border-primary-600 text-primary-700' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                        {tab}
                      </button>
                    ))}
                  </div>

                  <div className="p-6 min-h-[160px] text-gray-600 text-sm bg-white">
                    <h4 className="font-bold text-gray-800 mb-1 text-xs uppercase text-primary-800">{activeInfoTab} Checklist</h4>
                    <p>{result[activeInfoTab]}</p>
                  </div>

                  <div className="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-between items-center">
                    <span className="text-[10px] text-gray-400 italic">Report compiling system: ReportLab PDF</span>
                    <a href={`/api/report/${result.id}`} target="_blank" rel="noopener noreferrer" className="bg-primary-600 hover:bg-primary-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center space-x-1">
                      <span>📥 Download PDF Report</span>
                    </a>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // HISTORY SCREEN VIEW
    function HistoryView({ token, onNavigate }) {
      const [records, setRecords] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedRecord, setSelectedRecord] = useState(null);

      useEffect(() => {
        fetch('/api/history', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => { setRecords(data); setLoading(false); })
        .catch(() => setLoading(false));
      }, []);

      if (loading) return <div className="text-center py-20 text-sm font-semibold">Fetching logs...</div>;

      return (
        <div className="max-w-6xl mx-auto px-4 py-12">
          <div className="mb-8">
            <h1 className="text-3xl font-extrabold text-gray-900">Diagnosis <span className="text-primary-700">History Log</span></h1>
            <p className="text-gray-500 text-sm mt-1">Review previously logged diagnoses and download certification reports.</p>
          </div>

          {records.length === 0 ? (
            <div className="bg-white rounded-3xl p-12 text-center max-w-sm mx-auto shadow-sm">
              <span className="text-4xl">📂</span>
              <h3 className="text-lg font-bold text-gray-800 mt-3">Log is Empty</h3>
              <p className="text-xs text-gray-500 mt-1 mb-6">No previous scans found. Run a new leaf diagnosis first.</p>
              <button onClick={() => onNavigate('predictor')} className="bg-primary-600 hover:bg-primary-700 text-white font-bold px-6 py-2 rounded-xl text-xs">Run Diagnosis</button>
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className={selectedRecord ? 'lg:col-span-7' : 'lg:col-span-12'}>
                <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-xs">
                  <table className="min-w-full divide-y divide-gray-100">
                    <thead className="bg-gray-50">
                      <tr>
                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase">Crop</th>
                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase">Status</th>
                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase">Certainty</th>
                        <th className="px-6 py-3 text-right text-xs font-bold text-gray-400 uppercase">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 bg-white">
                      {records.map(rec => (
                        <tr key={rec.id} className="hover:bg-primary-50/20">
                          <td className="px-6 py-4">
                            <div className="font-bold text-gray-800 text-sm">{rec.crop_name}</div>
                            <div className="text-[10px] text-gray-500">{rec.disease_name}</div>
                          </td>
                          <td className="px-6 py-4">
                            <span className={`px-2 py-0.5 rounded-full text-[9px] font-black uppercase ${rec.status === 'Healthy' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                              {rec.status}
                            </span>
                          </td>
                          <td className="px-6 py-4 font-bold text-sm">{rec.confidence}%</td>
                          <td className="px-6 py-4 text-right space-x-2">
                            <button onClick={() => setSelectedRecord(rec)} className="p-1 border border-gray-200 rounded-lg hover:bg-primary-50 text-gray-600">👁️</button>
                            <a href={`/api/report/${rec.id}`} target="_blank" rel="noopener noreferrer" className="p-1 bg-primary-600 text-white rounded-lg hover:bg-primary-700 inline-block">📥</a>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {selectedRecord && (
                <div className="lg:col-span-5 bg-white border border-gray-100 rounded-3xl p-6 shadow-sm sticky top-24">
                  <div className="flex justify-between items-start mb-6">
                    <div>
                      <span className="text-[9px] font-black uppercase bg-primary-100 text-primary-800 px-3 py-1 rounded-full">Report card</span>
                      <h3 className="text-xl font-extrabold text-gray-900 mt-2">{selectedRecord.crop_name}: <span className="text-primary-600">{selectedRecord.disease_name}</span></h3>
                      <p className="text-[10px] text-gray-400 mt-1">Logged on: {selectedRecord.created_at}</p>
                    </div>
                    <button onClick={() => setSelectedRecord(null)} className="text-xs text-gray-400 hover:text-gray-600 font-bold border border-gray-200 px-2 py-0.5 rounded-lg">Hide</button>
                  </div>
                  <div className="rounded-2xl overflow-hidden border border-gray-200 h-44 mb-6 bg-gray-50 flex items-center justify-center">
                    <img src={selectedRecord.image_url} alt="Leaf Specimen" className="max-h-full max-w-full object-contain" />
                  </div>
                  <a href={`/api/report/${selectedRecord.id}`} target="_blank" rel="noopener noreferrer" className="w-full py-3.5 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-2xl text-sm flex items-center justify-center space-x-1.5 shadow-md">
                    <span>Download PDF Certificate</span>
                  </a>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // DASHBOARD VIEW
    function DashboardView({ token, onNavigate }) {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const canvasRef = useRef(null);
      const pieCanvasRef = useRef(null);

      useEffect(() => {
        fetch('/api/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
          setStats(data);
          setLoading(false);
        })
        .catch(() => setLoading(false));
      }, []);

      // Draw Charts using Chart.js
      useEffect(() => {
        if (!stats || stats.total === 0) return;

        // 1. Bar Chart - Disease occurrences
        const barCtx = canvasRef.current.getContext('2d');
        const diseases = Object.keys(stats.disease_counts);
        const barChart = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: diseases.map(d => d.split('___').pop().replace(/_/g, ' ')),
            datasets: [{
              label: 'Infection Frequency',
              data: diseases.map(d => stats.disease_counts[d]),
              backgroundColor: '#ef4444',
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
          }
        });

        // 2. Pie Chart - Crop Share
        const pieCtx = pieCanvasRef.current.getContext('2d');
        const crops = Object.keys(stats.crop_counts);
        const pieChart = new Chart(pieCtx, {
          type: 'doughnut',
          data: {
            labels: crops,
            datasets: [{
              data: crops.map(c => stats.crop_counts[c]),
              backgroundColor: ['#15803d', '#22c55e', '#a3e635', '#f59e0b']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });

        // Cleanup charts
        return () => {
          barChart.destroy();
          pieChart.destroy();
        };
      }, [stats]);

      if (loading) return <div className="text-center py-20 text-sm font-semibold">Generating analytics...</div>;

      const hasData = stats && stats.total > 0;

      return (
        <div className="max-w-6xl mx-auto px-4 py-12">
          <div className="mb-8">
            <h1 className="text-3xl font-extrabold text-gray-900">Performance <span className="text-primary-700">Analytics Dashboard</span></h1>
            <p className="text-gray-500 text-sm mt-1">Aggregate statistics for your registered plant scans.</p>
          </div>

          {!hasData ? (
            <div className="bg-white rounded-3xl p-12 text-center max-w-sm mx-auto shadow-sm">
              <span className="text-4xl">📊</span>
              <h3 className="text-lg font-bold text-gray-800 mt-3">No stats available</h3>
              <p className="text-xs text-gray-500 mt-1 mb-6">Diagnose crop specimens to display interactive charts.</p>
              <button onClick={() => onNavigate('predictor')} className="bg-primary-600 hover:bg-primary-700 text-white font-bold px-6 py-2 rounded-xl text-xs">Run Diagnosis</button>
            </div>
          ) : (
            <div className="space-y-8 animate-in fade-in duration-300">
              {/* Aggregates row */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-2xs">
                  <div className="text-xs text-gray-400 font-bold uppercase">Total Scans</div>
                  <div className="text-2xl font-black text-gray-950 mt-1">{stats.total}</div>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-2xs">
                  <div className="text-xs text-gray-400 font-bold uppercase">Healthy Foliage</div>
                  <div className="text-2xl font-black text-green-700 mt-1">{stats.healthy}</div>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-2xs">
                  <div className="text-xs text-gray-400 font-bold uppercase">Infections Caught</div>
                  <div className="text-2xl font-black text-red-600 mt-1">{stats.diseased}</div>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-2xs">
                  <div className="text-xs text-gray-400 font-bold uppercase">Avg Accuracy</div>
                  <div className="text-2xl font-black text-amber-500 mt-1">{stats.avg_confidence}%</div>
                </div>
              </div>

              {/* Charts displays */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-4 bg-white p-6 rounded-3xl border border-gray-100 shadow-xs h-[380px] flex flex-col">
                  <h3 className="font-bold text-gray-800 text-xs uppercase tracking-wider mb-4">Crop Specimen Share</h3>
                  <div className="flex-1 relative min-h-0">
                    <canvas ref={pieCanvasRef}></canvas>
                  </div>
                </div>
                
                <div className="lg:col-span-8 bg-white p-6 rounded-3xl border border-gray-100 shadow-xs h-[380px] flex flex-col">
                  <h3 className="font-bold text-gray-800 text-xs uppercase tracking-wider mb-4">Infection Frequency</h3>
                  <div className="flex-1 relative min-h-0">
                    <canvas ref={canvasRef}></canvas>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
